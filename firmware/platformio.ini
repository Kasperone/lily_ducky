; =============================================================================
; PlatformIO project — lily_ducky (LilyDucky)
; =============================================================================
; Two targets:
;   T-Dongle-C5  — LILYGO ESP32-C5  (primary; hardware on hand)
;                  NO USB-OTG: USB-A port is a Serial/JTAG console only.
;                  Runs interpreter + WiFi C2 + LCD + SD. Cannot type.
;   T-Dongle-S3  — LILYGO ESP32-S3  (full BadUSB: USB HID keyboard)
;
; Platform note: the official platformio/espressif32 platform does not
; support ESP32-C5 (its Arduino core is stuck on 2.x). The pioarduino
; community fork tracks Arduino-ESP32 3.x (IDF 5.5) and builds both
; chips, so it is used for all environments.
; =============================================================================

[platformio]
default_envs = T-Dongle-C5

[env]
framework = arduino
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
monitor_speed = 115200
monitor_filters = colorize
; src/diag/ holds standalone alternate-firmware diagnostics (their own
; setup()/loop(), e.g. led_spi_diag.cpp) that must NOT be pulled into the
; normal firmware build alongside main.cpp's setup()/loop() — that's a
; duplicate-definition link error. Excluded by default; the one env that
; wants a given diag file re-includes it and excludes main.cpp instead.
build_src_filter = +<*> -<diag/>

; ─── Library deps ─────────────────────────────────────
;    SD card: SD.h / SD_MMC.h          (built-in)
;    Web server: WebServer.h           (built-in)
;    USB keyboard: USBHID + Keyboard   (built-in, S3 only)
;    WiFi: WiFi.h                      (built-in)
;    LED: APA102 bit-banged in hal.cpp (no lib needed)
;    LCD: TFT_eSPI 2.5.43 — VENDORED in lib/TFT_eSPI (upstream has no
;         ESP32-C5 processor support, Bodmer/TFT_eSPI#3751; the vendored
;         copy adds Processors/TFT_eSPI_ESP32_C5.c/.h derived from the
;         C3 files, validated on real C5 hardware). No lib_deps entry:
;         the registry copy would shadow nothing but download dead weight
;         and drift from the patched source.

; =============================================================================
; LILYGO T-Dongle-C5 (ESP32-C5) — 16MB Flash, 8MB PSRAM, WiFi 6, BLE 5
; =============================================================================
[env:T-Dongle-C5]
board = Lilygo-T-Dongle-C5
upload_speed = 460800
build_flags =
    -DTARGET_DONGLE_C5
    ; Mode 1 (Hardware CDC + JTAG) is the ONLY option on the C5 — no USB-OTG,
    ; so TinyUSB/HID is unavailable regardless (see config.h CFG_HAS_USB_HID).
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    ; ─── TFT_eSPI configuration for the ST7735 80x160 panel ──────────
    ; Pin values must match config.h. xstart/ystart offsets are required
    ; for the 80x160 ST7735 variant (visible area starts at column 26,
    ; row 1 within the controller's 132x162 RAM).
    -DUSER_SETUP_LOADED=1
    -DST7735_DRIVER=1
    -DTFT_WIDTH=80
    -DTFT_HEIGHT=160
    -DST7735_GREENTAB160x80=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON=1
    -DTFT_MOSI=2
    -DTFT_SCLK=6
    -DTFT_CS=10
    -DTFT_DC=3
    -DTFT_RST=1
    -DTFT_BL=0
    ; Backlight is ACTIVE-LOW on the T-Dongle-C5 (LilyGO factory firmware:
    ; digitalWrite(PIN_LCD_BL, 0) = ON). Driving it HIGH leaves the screen
    ; pitch black even when the panel draws.
    -DTFT_BACKLIGHT_ON=LOW
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DSPI_FREQUENCY=27000000

; =============================================================================
; LED SPI DIAGNOSTIC (T-Dongle-C5) — hardware-SPI (FSPI) APA102 test
; =============================================================================
; See firmware/src/diag/led_spi_diag.cpp and
; docs/knowledge-base/open-questions.md #1 for why this exists: bit-banged
; digitalWrite drivers (ours and the vendor's) froze most of the time on two
; physical units, and an earlier SPIClass(HSPI) attempt silently no-op'd
; because HSPI (=1) isn't a valid SPI bus index on the C5 (SPI_COUNT=1 on
; this chip family in arduino-esp32's esp32-hal-spi.c — only FSPI/0 exists).
; Does not touch or replace the main firmware; builds a separate binary from
; the same source tree with main.cpp excluded.
;
; Two variants, same source file, differing only in whether
; usb_jtag_bridge_en gets set (LEDDIAG_SET_BRIDGE_EN) — see the diag file's
; header comment for the register-doc-sourced reason this bit is now
; suspected to be actively harmful (forces GPIO5/MTDO/LED-data to INPUT)
; rather than the "release the pins" fix it was originally believed to be.
;   pio run -e T-Dongle-C5-leddiag -t upload -t monitor            (bridge_en untouched — corrected theory)
;   pio run -e T-Dongle-C5-leddiag-bridge-en -t upload -t monitor  (bridge_en=1 — reproduces the white result)
[env:T-Dongle-C5-leddiag]
extends = env:T-Dongle-C5
; Exclude main.cpp (its setup/loop would clash) AND the other diag files,
; each of which also defines setup()/loop() — including two would be a
; duplicate-definition link error. One diag file per diag env.
build_src_filter = +<*> -<main.cpp> -<diag/led_pinmap_diag.cpp>
; Verbose core logging, overriding the base env's CORE_DEBUG_LEVEL=0 (last
; -D for a given macro wins on the GCC command line) — the base level
; silences exactly the kind of "SPI bus index out of range" error that
; explained the earlier SPIClass(HSPI) silent failure. If SPIClass(FSPI) is
; also failing silently for some other reason, this is how we'd see it.
build_flags =
    ${env:T-Dongle-C5.build_flags}
    -DCORE_DEBUG_LEVEL=5

[env:T-Dongle-C5-leddiag-bridge-en]
extends = env:T-Dongle-C5-leddiag
build_flags =
    ${env:T-Dongle-C5-leddiag.build_flags}
    -DLEDDIAG_SET_BRIDGE_EN=1

; =============================================================================
; LED PIN-MAP DECIDER (T-Dongle-C5) — vendor 4/5 vs zombodotcom 2/6
; =============================================================================
; See firmware/src/diag/led_pinmap_diag.cpp and open-questions.md #1's pin-map
; dispute. Drives an APA102 colour cycle on BOTH candidate pin pairs in turn,
; LED-only (LCD not initialised), so watching the LED reveals which pinset it
; is actually wired to. One flash resolves whether the "dead LED" conclusion
; was really just the wrong pins the whole time.
;   pio run -e T-Dongle-C5-pinmap -t upload -t monitor
[env:T-Dongle-C5-pinmap]
extends = env:T-Dongle-C5
; Include only this diag's setup()/loop(); exclude main.cpp and the other diag.
build_src_filter = +<*> -<main.cpp> -<diag/led_spi_diag.cpp>

; Single-phase variants — drive ONE candidate pinset continuously so a watcher
; only has to judge "colours or not," no phase-tracking. Flash one, observe,
; then the other.
;   pio run -e T-Dongle-C5-pinmap-A -t upload   (only GPIO2/6 — zombodotcom theory)
;   pio run -e T-Dongle-C5-pinmap-B -t upload   (only GPIO5/4 — vendor theory)
[env:T-Dongle-C5-pinmap-A]
extends = env:T-Dongle-C5-pinmap
build_flags =
    ${env:T-Dongle-C5-pinmap.build_flags}
    -DPINMAP_PHASE=1

[env:T-Dongle-C5-pinmap-B]
extends = env:T-Dongle-C5-pinmap
build_flags =
    ${env:T-Dongle-C5-pinmap.build_flags}
    -DPINMAP_PHASE=2

; =============================================================================
; LILYGO T-Dongle-S3 (ESP32-S3) — 16MB Flash, USB-OTG (HID keyboard)
; =============================================================================
[env:T-Dongle-S3]
board = dongles3
board_build.partitions = partitions.csv
upload_speed = 921600
build_flags =
    -DTARGET_DONGLE_S3
    ; USB-OTG / TinyUSB mode (=0) is REQUIRED for HID: USBHIDKeyboard only
    ; compiles under CONFIG_TINYUSB_HID_ENABLED, which mode 1 (Hardware
    ; CDC + JTAG) turns off. Mode 0 is the whole point of the S3 target.
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    ; USB VID/PID spoofing (Logitech Unifying Receiver) — S3 only;
    ; the C5's USB Serial/JTAG identity is fixed in silicon.
    -DUSB_VID=0x046D
    -DUSB_PID=0xC52B
    ; ─── TFT_eSPI configuration for T-Dongle-S3 ST7735 80x160 ────────
    -DUSER_SETUP_LOADED=1
    -DST7735_DRIVER=1
    -DTFT_WIDTH=80
    -DTFT_HEIGHT=160
    -DST7735_GREENTAB160x80=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON=1
    -DTFT_MOSI=3
    -DTFT_SCLK=5
    -DTFT_CS=4
    -DTFT_DC=2
    -DTFT_RST=1
    -DTFT_BL=37
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DSPI_FREQUENCY=27000000

; =============================================================================
; C2 LOOPBACK SELF-TEST (T-Dongle-C5) — end-to-end REST API test, no WiFi client
; =============================================================================
; See firmware/src/c2/c2_selftest.cpp. The build/flash host is a headless VM
; with no WiFi radio, so it can never join the SoftAP to run
; scripts/c2_api_test.sh. This env compiles the FULL firmware plus an on-device
; HTTP client that hits the C2 server's own SoftAP IP over loopback and drives
; the same 8 checks, printing [PASS]/[FAIL] to the USB serial console — so a
; headless capture (scripts/serial_monitor.py) is the whole verification.
; Loopback covers the HTTP+handler+interpreter+SD path, NOT the radio path.
;   pio run -e T-Dongle-C5-selftest -t upload -t monitor
[env:T-Dongle-C5-selftest]
extends = env:T-Dongle-C5
build_flags =
    ${env:T-Dongle-C5.build_flags}
    -DCFG_C2_SELFTEST=1
