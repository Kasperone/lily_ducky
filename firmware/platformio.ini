[platformio]
default_envs = T-Dongle-S3

[env:T-Dongle-S3]
platform = espressif32@6.12.0
framework = arduino
board = dongles3

board_build.partitions = partitions.csv

upload_speed = 921600
monitor_speed = 115200

; ─── Build flags ───────────────────────────────────────
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    ; USB VID/PID spoofing (Logitech Unifying Receiver)
    -DUSB_VID=0x046D
    -DUSB_PID=0xC52B
    ; ─── TFT_eSPI configuration for T-Dongle-S3 ST7735 80x160 ────────
    ; Pin values must match config.h. xstart/ystart offsets are required
    ; for the 80x160 ST7735 variant (visible area starts at column 26,
    ; row 1 within the controller's 132x162 RAM).
    -DUSER_SETUP_LOADED=1
    -DST7735_DRIVER=1
    -DTFT_WIDTH=80
    -DTFT_HEIGHT=160
    -DST7735_GREENTAB160x80=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON=1
    -DTFT_MOSI=3
    -DTFT_SCLK=5
    -DTFT_CS=4
    -DTFT_DC=2
    -DTFT_RST=1
    -DTFT_BL=37
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DSPI_FREQUENCY=27000000

; ─── Library deps ─────────────────────────────────────
;    SD card: SD.h + SD_MMC.h  (built-in)
;    Web server: WebServer.h  (built-in, synchronous)
;    USB keyboard: USBHID + Keyboard  (built-in)
;    WiFi: WiFi.h  (built-in)
;    LED: APA102 (bit-banged via SPI)  (no lib needed)
;    LCD: TFT_eSPI (one external dep — chosen over hand-rolled
;         ST7735 init for board-validated correctness)
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
